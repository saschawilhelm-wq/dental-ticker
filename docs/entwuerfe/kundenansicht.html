s, es handelt sich um ein laufendes Gesetzgebungsvorhaben. Ob und wie Zahnarztpraxen als Berufsgeheimnisträger ausdrücklich einbezogen werden, bleibt abzuwarten.", "importance": 20, "reasons": ["Betrifft Praxen indirekt", "Erst Entwurf"], "category": "recht_politik", "status": "published", "hb": "beobachten", "frist": null, "datum": "2026-11-12T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/anpassungen-zum-schutz-der-arzt-patienten-beziehung"}], "roles": ["zahnarzt"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "recht-politik"}, {"id": "96d2f90d-12d5-4be6-bbf3-dc3dbf51bc00", "headline": "gematik erweitert Apothekensuche in der E-Rezept-App", "summary": "Die gematik hat die Suchfunktion ihrer App „Das E-Rezept“ überarbeitet. Apotheken können nun zusätzliche Angaben zu ihren Leistungen hinterlegen, etwa zu Impfangeboten oder zur Barrierefreiheit, und Nutzer können danach filtern. Außerdem sind Favoriten und zuletzt besuchte Apotheken klarer getrennt, und die Filter sind kontrastreicher und leichter erkennbar gestaltet.", "wbd": "Für Zahnarztpraxen ändert sich nichts an der Ausstellung von E-Rezepten. Die Neuerung betrifft allein die Patientenseite bei der Wahl der Apotheke.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-05-05T08:00:00+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/e-rezept-app-verbesserte-suche-fuer-mehr-apothekenservices"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "9a88df7d-f51e-433e-839a-3b826701e46e", "headline": "GKV-Spitzenverband legt erste Zahlen zur Versichertenansprache durch Kassen vor", "summary": "Gesetzliche Kranken- und Pflegekassen können seit 2024 Daten ihrer Versicherten auswerten und sie bei Hinweisen auf bestimmte Krankheiten gezielt ansprechen. Der GKV-Spitzenverband hat dazu nun eine erste Auswertung veröffentlicht. Demnach kam es bislang in rund 1,5 Millionen Fällen zu einer solchen Kontaktaufnahme.", "wbd": "Für Zahnarztpraxen ändert sich unmittelbar nichts; es handelt sich um eine Information zur Datennutzung durch die Kassen. Patienten könnten das Thema gelegentlich in der Praxis ansprechen.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "gkv_pkv", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-11T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/gkv-versicherte-wurden-in-15-millionen-faellen-kontaktiert"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "gkv-pkv"}, {"id": "9af21c6c-d046-4c1c-a5cd-23ef87e66fbb", "headline": "Umfrage: Viele Menschen haben Mühe mit medizinischer Fachsprache", "summary": "Eine repräsentative Befragung zeigt, dass die meisten Menschen in Deutschland ohne große Schwierigkeiten an Gesundheitsinformationen gelangen. Das inhaltliche Verständnis dieser Informationen fällt jedoch vielen schwer. Als ein wesentliches Hindernis gilt die Fachsprache, laut Titel besonders bei älteren Menschen.", "wbd": "Für Praxen ändert sich nichts unmittelbar. Die Ergebnisse unterstreichen jedoch, wie wichtig verständliche Aufklärung und Patienteninformationen ohne Fachbegriffe sind, gerade bei älteren Patientinnen und Patienten.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "wissenschaft", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/fuer-viele-ist-medizinische-fachsprache-schwer-zu-verstehen"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "wissenschaft"}, {"id": "9b081349-ac1f-4f3b-9fc9-746946a4ba72", "headline": "LSG Celle: Datenschutz und Schweigepflicht befreien nicht vom Stammdatenabgleich", "summary": "Das Landessozialgericht Celle hat in einem kürzlich veröffentlichten Urteil entschieden, dass Zahnarztpraxen den Abgleich der Versichertenstammdaten über die Telematikinfrastruktur durchführen müssen. Bedenken wegen Datenschutz oder ärztlicher Schweigepflicht rechtfertigen nach Auffassung des Gerichts keine Ausnahme. Weitere Einzelheiten wie Aktenzeichen oder Verfahrensstand nennt die Meldung nicht.", "wbd": "Praxen können sich nicht unter Berufung auf Datenschutz oder Schweigepflicht vom Versichertenstammdatenabgleich ausnehmen. Für Praxen, die die TI bereits nutzen, ändert sich nichts; Details sind der Urteilsbegründung zu entnehmen.", "importance": 45, "reasons": ["Betrifft Praxen direkt", "Urteil"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-11T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/datenschutz-und-schweigepflicht-stehen-ti-nicht-entgegen"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "9cd1df1a-ebc5-4cf8-8839-c499abef8d4e", "headline": "W&H erweitert Turbine Synea Fusion um zusätzliche Funktionen", "summary": "Der Hersteller W&H hat seine Turbine Synea Fusion mit weiteren Ausstattungsmerkmalen versehen, die er als Premium-Funktionen bezeichnet. Laut Unternehmen bleibt der Preis dabei unverändert. In einem Interview auf ZWP online beschreibt Produktmanager Patrick Lang die Hintergründe des Upgrades aus Herstellersicht.", "wbd": "Für Praxen ändert sich nichts verpflichtend; wer Turbinen anschaffen will, erhält hier eine Produktinformation des Herstellers. Konkrete technische Details nennt die Meldung nicht.", "importance": 15, "reasons": ["Betrifft Praxen direkt", "Bericht", "Unternehmensmeldung"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-11T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/synea-fusion-premium-upgrade-inklusive"}], "roles": ["zahnarzt", "industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}, {"id": "a46a7dd2-a03a-4005-a197-e0f05858424b", "headline": "DG-Paro-Jahrestagung in Heidelberg: PAR-Richtlinie, Diabetes und Antibiotika im Fokus", "summary": "Bei der Jahrestagung der DG Paro Ende September 2026 in Heidelberg kamen rund 800 Teilnehmende zusammen, um über den Ausgleich zwischen bewährten Verfahren und neuen Entwicklungen in der Parodontologie zu diskutieren. KZBV-Chef Martin Hendges zog nach fünf Jahren PAR-Richtlinie Bilanz und kritisierte, dass die Budgetvorgaben seit 2022 die Versorgung der vielen Erkrankten erschweren. Weitere Vorträge befassten sich mit dem Zusammenhang von Diabetes und Parodontitis, dem ergänzenden Einsatz von Biotika sowie mit systemischen und lokalen Antibiotika und dem Verordnungsverhalten in Zahnarztpraxen.", "wbd": "Für Praxen ändert sich unmittelbar nichts; der Bericht gibt einen Überblick über den fachlichen Diskussionsstand, etwa zur engeren Zusammenarbeit mit Hausärzten bei Diabetikern und zum zurückhaltenden Antibiotikaeinsatz.", "importance": 25, "reasons": ["Betrifft Praxen direkt", "Veranstaltung"], "category": "fortbildung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T10:21:21+00:00", "quellen": [{"name": "DZW / mgb dental (Test)", "url": "https://mgb-dental.de/news/zahnmedizin/stabilitaet-und-progression-%e2%88%92-stillstand-und-fortschritt"}], "roles": ["zahnarzt", "team"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "fortbildung"}, {"id": "a979c255-9424-4290-8a7b-9fcf42fe1143", "headline": "gematik stellt auf der DMEA 2026 in Berlin ePA, TI 2.0 und Interoperabilität vor", "summary": "Die gematik ist vom 21. bis 23. April 2026 mit einem eigenen Stand auf der Digital-Health-Messe DMEA in Berlin vertreten. Schwerpunkte sind die Weiterentwicklung der elektronischen Patientenakte, die TI 2.0 mit Ablösung hardwarebasierter Komponenten etwa durch das TI-Gateway sowie grenzüberschreitender Datenaustausch. Neben Vorträgen der Geschäftsführung und von Fachleuten gibt es eine Meet-up-Fläche für den Austausch mit Partnern.", "wbd": "Für Praxen ändert sich durch die Messe nichts; wer sich über die Pläne zu ePA-Funktionen und TI 2.0 informieren möchte, findet dort bzw. im gematik-Programm Einblicke in kommende Entwicklungen.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "fortbildung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-03-19T11:11:59+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/die-gematik-auf-der-dmea-2026-zukunft-vernetzt-sich"}], "roles": [], "fristIso": null, "terminIso": "2026-04-21", "fb": null, "network": false, "slug": "fortbildung"}, {"id": "ab12d02a-1a4b-47fb-918b-362a135a4203", "headline": "gematik empfängt EU-Delegation zum grenzüberschreitenden Gesundheitsdatenaustausch", "summary": "Rund 50 Fachleute aus 14 europäischen Staaten und der EU-Kommission haben sich bei der gematik getroffen, teils vor Ort, teils online. Besprochen wurden vor allem die nationale Kontaktstelle für eHealth (NCPeH), die die deutsche TI mit der EU-Infrastruktur MyHealth@EU verbindet, sowie Anforderungen aus dem Europäischen Gesundheitsdatenraum (EHDS). Neben Architekturfragen stand der Schutz sensibler Gesundheitsdaten beim Austausch über Ländergrenzen im Fokus.", "wbd": "Für Zahnarztpraxen ändert sich derzeit nichts. Perspektivisch sollen Versicherte Daten wie Befunde oder E-Rezepte auch im EU-Ausland nutzen können, konkrete Vorgaben oder Termine für Praxen nennt die Meldung nicht.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-03-16T09:45:17+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/grenzueberschreitender-digitaler-gesundheitsdatenaustausch-europaeische-delegation-bei-der-gematik"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "ab31a557-3bcd-4cf6-9b2f-e3f1b73e9dfa", "headline": "Solventum-Webinar zur Anwendung von Clinpro-Prophylaxeprodukten", "summary": "Der Hersteller Solventum lädt zu einem Online-Seminar über zwei seiner Prophylaxeprodukte ein, Clinpro Clear und Clinpro Prophy Powder. Eine Zahnmedizinische Prophylaxeassistentin schildert dort ihre Erfahrungen mit diesen Produkten aus dem eigenen Praxisalltag. Zudem sollen Hinweise zur praktischen Handhabung vermittelt werden; ein Termin ist in der Meldung nicht genannt.", "wbd": "Für Praxen ändert sich nichts; Prophylaxeteams, die sich für diese Produkte interessieren, können sich beim Hersteller über Termin und Teilnahme informieren. Es handelt sich um ein Herstellerangebot zu eigenen Produkten.", "importance": 5, "reasons": ["Betrifft Praxen direkt", "Veranstaltung", "Unternehmensmeldung"], "category": "fortbildung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-16T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/solventum-webinar-prophylaxeprodukte-im-fokus-praxis-trifft-wissenschaft"}], "roles": ["team"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "fortbildung"}, {"id": "ace55a9a-16a6-4e67-9d68-b40b4017acbf", "headline": "gematik veröffentlicht Jahresmagazin 2026 mit Schwerpunkt TI 2.0", "summary": "Die gematik hat ihr Magazin für 2026 herausgegeben, das die Rolle der Telematikinfrastruktur im digitalen Versorgungsalltag darstellt. Im Mittelpunkt stehen die neuen Zugangs- und Sicherheitsdienste der TI 2.0, die eine ortsunabhängigere Nutzung digitaler Anwendungen ermöglichen sollen. Weitere Themen sind unter anderem die elektronische Patientenakte, die Betriebsstabilität und Sicherheit der TI sowie der europäische Kontext, dazu äußern sich Fachleute, Heilberufler und Patienten.", "wbd": "Für Praxen ändert sich dadurch nichts unmittelbar; das Magazin bietet lediglich einen Überblick über geplante Entwicklungen der TI. Wer sich frühzeitig über TI 2.0 informieren möchte, findet die PDF-Ausgabe bei der gematik.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-04-28T08:00:00+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/weiter-gehts-das-gematik-magazin-2026-ist-da"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "ad3add80-948a-446d-967d-6294fe374f6c", "headline": "Photonenzählende CT: Forschende ordnen Studienergebnisse zu Wurzelfrakturen ein", "summary": "Wurzelfrakturen sind in der Endodontie nach wie vor schwer zuverlässig zu diagnostizieren. Untersucht wird, ob die photonenzählende Computertomographie hier zusätzliche diagnostische Möglichkeiten bietet. In einem Interview bewerten Wissenschaftler erste Ergebnisse ihrer Untersuchungen dazu.", "wbd": "Für Praxen ändert sich vorerst nichts, denn es handelt sich um frühe Forschungsergebnisse. Wer endodontisch tätig ist, kann die Entwicklung dieses Bildgebungsverfahrens im Blick behalten.", "importance": 10, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "wissenschaft", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/wurzelfrakturen-praziser-erkennen-neue-perspektiven-durch-photonenzahlende-ct"}], "roles": ["zahnarzt"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "wissenschaft"}, {"id": "ae2c139e-e37f-453e-a75a-c57e6771bcd2", "headline": "Festakt erinnert an 35 Jahre KZVen in den neuen Bundesländern", "summary": "Bei einem Festakt wurde an den Aufbau der Kassenzahnärztlichen Vereinigungen in Ostdeutschland vor 35 Jahren erinnert. Die Teilnehmenden würdigten die damalige Aufbauarbeit als große Anstrengung, die Engagierte aus beiden Teilen Deutschlands gemeinsam getragen hätten. Die Veranstaltung stand im Zeichen der Selbstverwaltung als Ausdruck demokratischer Mitwirkung.", "wbd": "Für den Praxisalltag ändert sich dadurch nichts; es handelt sich um einen Rückblick auf die Geschichte der zahnärztlichen Selbstverwaltung.", "importance": 0, "reasons": ["Betrifft Praxen indirekt", "Veranstaltung"], "category": "standespolitik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-10T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/selbstverwaltung-ist-gelebte-demokratie"}], "roles": ["zahnarzt"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "standespolitik"}, {"id": "b2524f09-735f-4249-beb0-eaef3303b754", "headline": "Wasserqualität in der Praxis nach den Herbstferien prüfen", "summary": "Nach einer Schließzeit, etwa in den Herbstferien, kann sich die Wasserqualität in den Leitungen und Behandlungseinheiten einer Praxis verändern. Der Beitrag rät daher, das Wasser vor dem Wiederanlauf des Betriebs gezielt prüfen zu lassen. Konkrete Grenzwerte, Vorgaben oder Verfahren nennt der kurze Text nicht.", "wbd": "Praxen, die über die Ferien geschlossen waren, sollten ihre üblichen Hygieneabläufe zur Wasserqualität nach der Pause beachten. Neue Pflichten ergeben sich aus der Meldung nicht; maßgeblich bleiben die bestehenden Hygienevorgaben.", "importance": 53, "reasons": ["Betrifft Praxen direkt", "Empfehlung"], "category": "hygiene_mp", "status": "published", "hb": "beobachten", "frist": null, "datum": "2026-11-16T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/wie-steht-es-um-ihre-wasserqualitat-nach-den-herbstferien"}], "roles": ["zahnarzt", "team"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "hygiene-mp"}, {"id": "b61d167e-c1cb-4585-8de5-c1c72b3922fe", "headline": "DGET-Jahrestagung: Endodontie-Experten sprechen offen über eigene Behandlungsfehler", "summary": "Auf der Jahrestagung der Deutschen Gesellschaft für Endodontologie und Traumatologie gab es eine Session, die sich dem Lernen aus Fehlern widmete. Fachleute schilderten dort Fälle aus ihrer eigenen Praxis, bei denen sie bei Wurzelkanalbehandlungen an Grenzen gestoßen sind. Weitere Einzelheiten zu den vorgestellten Fällen nennt die vorliegende Kurzmeldung nicht.", "wbd": "Für Praxen ändert sich nichts; die Meldung bietet Anregungen für die kritische Reflexion eigener endodontischer Behandlungen. Details finden Interessierte im vollständigen Beitrag der Quelle.", "importance": 25, "reasons": ["Betrifft Praxen direkt", "Veranstaltung"], "category": "fortbildung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-16T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/keine-gewalt-im-wurzelkanal"}], "roles": ["zahnarzt"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "fortbildung"}, {"id": "b7cb51c5-fecb-4988-854b-6e013a0c1689", "headline": "40 Jahre Ottawa-Charta: Europäische Ärzteschaft berät in Berlin über Prävention", "summary": "Anlässlich des 40. Jahrestags der Ottawa-Charta zur Gesundheitsförderung kamen Spitzenvertreter der Ärzteschaft aus mehreren europäischen Ländern in Berlin zusammen. Im Mittelpunkt stand die Frage, wie sich die Prinzipien der Charta in konkrete Maßnahmen für mehr Bevölkerungsgesundheit übersetzen lassen. Die Teilnehmenden sprachen sich für neue Anstöße in der Präventionspolitik aus, nähere Einzelheiten nennt die Meldung nicht.", "wbd": "Für den Praxisalltag ändert sich dadurch nichts. Die Debatte kann jedoch den politischen Stellenwert der Prävention stärken, der auch für die Zahnmedizin von Bedeutung ist.", "importance": 0, "reasons": ["Betrifft Praxen indirekt", "Veranstaltung"], "category": "fortbildung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-16T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/europas-aerztinnen-und-aerzte-fordern-neue-impulse-fuer-die-praevention"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "fortbildung"}, {"id": "ba00364e-d99e-46ce-88e0-d0284d187d1c", "headline": "gematik testet kartenlose Institutionsidentität HSM-B erstmals über TI-Gateway", "summary": "Die gematik erprobt die digitale Institutionsidentität HSM-B, die die physische SMC-B-Karte ersetzen soll, nun auch in einer TI-Gateway-Umgebung. In einem Friendly User Test mit dem Anbieter eHealth Experts, D-Trust und weiteren Partnern nutzen ausgewählte Einrichtungen, darunter DiGA-Anbieter und eine Online-Apotheke, die Lösung bereits im Echtbetrieb. Ziel ist, einen späteren bundesweiten Einsatz vorzubereiten, der weniger Kartenterminals, Kartentausch und PIN-Eingaben mit sich bringen soll.", "wbd": "Für Zahnarztpraxen ändert sich derzeit nichts, die SMC-B im Kartenterminal bleibt weiterhin nutzbar. Langfristig könnte die kartenlose Lösung den Verwaltungsaufwand für Karten und Terminals verringern; ein Zeitplan für Praxen wird nicht genannt.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-05-11T10:16:00+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/hsm-b-im-ti-gateway-umfeld"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "bae9b046-0eb0-4699-9375-c98fe3a9e7c9", "headline": "DDG und diabetesDE legen neuen Gesundheitsbericht Diabetes zum Weltdiabetestag vor", "summary": "Anlässlich des Weltdiabetestags am 14. November 2026 erscheint ein neuer Gesundheitsbericht zum Thema Diabetes. Herausgeber sind die Deutsche Diabetes Gesellschaft und die Organisation diabetesDE – Deutsche Diabetes-Hilfe. Der Bericht soll aktuelle Zahlen und neue Erkenntnisse zur Erkrankung bündeln.", "wbd": "Für Praxen ändert sich nichts; der Bericht kann aber als Hintergrund dienen, da Diabetes und Parodontitis in Wechselwirkung stehen.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "wissenschaft", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/deutscher-gesundheitsbericht-diabetes-2027-erschienen"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "wissenschaft"}, {"id": "bd2a9685-4f10-4bd9-966d-fd0c89beea69", "headline": "gematik Insights: Wie Praxisteams E-Rezept und ePA in ihren Systemen bewerten", "summary": "Die gematik hat Ergebnisse des TI-Atlas 2025 ausgewertet, für den über 7.000 Beschäftigte aus Arzt- und Zahnarztpraxen, Apotheken, psychotherapeutischen Praxen und Pflegeeinrichtungen befragt wurden. Beim E-Rezept bewerten die Nutzenden die Bedienbarkeit ihrer Systeme besser als im Vorjahr, auch für die Software in Zahnarztpraxen zeigt sich ein positiver Trend. Bei der ePA fällt das Urteil je nach System noch sehr unterschiedlich aus; die Rückmeldungen gehen anonymisiert an die Hersteller, und der TI-Score soll künftig auch den Umsetzungsstand der ePA abbilden.", "wbd": "Für Praxen ändert sich unmittelbar nichts, es besteht kein Handlungsbedarf. Der geplante ePA-Bereich im TI-Score kann Praxen künftig beim Vergleich ihres Praxisverwaltungssystems helfen; die vollständige Auswertung ist bei der gematik abrufbar.", "importance": 50, "reasons": ["Betrifft Praxen direkt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-02-04T14:00:00+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/gematik-insights-so-erleben-nutzerinnen-die-digitalisierung-im-praxisalltag"}], "roles": ["zahnarzt", "praxismanagement", "team", "industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "c55352ce-ed0a-4759-8193-dac2d93c8994", "headline": "VDDI beruft Tabea-Elisabeth Fey in seinen Beirat", "summary": "Der Verband der Deutschen Dental-Industrie hat Tabea-Elisabeth Fey in seinen Beirat aufgenommen. Die Entscheidung fiel in der gemeinsamen Sitzung von Vorstand und Beirat am 4. November 2026. Vorstand und Beirat stimmten der Kooptierung ohne Gegenstimme zu.", "wbd": "Für den Praxisalltag ändert sich dadurch nichts. Die Meldung betrifft die Gremienbesetzung des Industrieverbands.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/wirtschaft-und-recht/businessnews/verstarkung-im-vddi-beirat-dental-ist-meine-welt"}], "roles": ["industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}, {"id": "c85e5ab2-7a38-4817-9ea3-d3784a5b5131", "headline": "Sensodyne: Hersteller verweist auf Alltagsdaten zu schmerzempfindlichen Zähnen", "summary": "Laut der Meldung ist etwa die Hälfte der Erwachsenen von empfindlichen Zähnen betroffen. Der Hersteller beruft sich auf Daten aus Real-World-Studien, wonach die Beschwerden den Alltag spürbar beeinträchtigen können. Zugleich wird eine Zahnpasta der Marke Sensodyne mit NovaMin als klinisch geprüftes Produkt beworben.", "wbd": "Für Praxen ändert sich nichts; die Meldung ist eine Produktinformation eines Herstellers. Wer die zugrunde liegenden Studiendaten bewerten möchte, sollte die Originalveröffentlichungen heranziehen.", "importance": 0, "reasons": ["Betrifft Praxen indirekt", "Bericht", "Unternehmensmeldung"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-16T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/schmerzempfindlichkeit-mehr-als-nur-ein-kurzes-ziehen"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}, {"id": "cb7b7f07-0d48-49e1-a508-d39f140d897e", "headline": "gematik stellt sieben Leitsätze für die Digitalisierung des Gesundheitswesens vor", "summary": "Die gematik hat in einem Video sieben Grundsätze veröffentlicht, an denen sie ihre Arbeit an der Digitalisierung des Gesundheitswesens ausrichten will. Geschäftsführungschef Dr. Florian Fuhrmann nennt darin unter anderem den Vorrang eines stabilen Betriebs, weniger Komplexität sowie gemeinsame Daten und digitale Abläufe als zentrale Ziele. Außerdem betont die gematik, dass Versorgung im Mittelpunkt stehen soll und Digitalisierung nur gemeinsam mit den Partnern über Grenzen hinweg gelingen kann.", "wbd": "Für Praxen ändert sich vorerst nichts, es gibt keine neuen Pflichten oder Fristen. Interessant ist die angekündigte Priorität auf Betriebsstabilität, die sich künftig in weniger TI-Störungen zeigen könnte.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-01-15T13:37:20+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/sieben-leitlinien-der-gematik-fuer-die-digitale-zukunft-des-gesundheitswesens"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "cfe865d9-3611-414f-b16d-833065d02bc3", "headline": "Marburger Bund fordert weitere Bundesförderung für Cochrane Deutschland", "summary": "Der Marburger Bund setzt sich dafür ein, dass der Bund die Cochrane Deutschland Stiftung auch nach 2027 weiter finanziert. Hintergrund ist offenbar, dass die Bundesregierung ihre Unterstützung beenden will. Die Ärztegewerkschaft richtet ihren Appell an die Bundesregierung und das Bundesgesundheitsministerium.", "wbd": "Für den Praxisalltag ändert sich derzeit nichts. Langfristig könnte ein Wegfall der Förderung die Verfügbarkeit unabhängiger Evidenzübersichten beeinträchtigen, auf die sich auch die Zahnmedizin stützt.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "wissenschaft", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-11T07:00:00+00:00", "quellen": [{"name": "zm online (Test)", "url": "https://www.zm-online.de/news/detail/marburger-bund-warnt-vor-aus-fuer-cochrane-foerderung"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "wissenschaft"}, {"id": "d6bdc5a3-ed61-4d90-8395-a81afcd169be", "headline": "Sinkende Website-Sichtbarkeit muss kein schlechtes Zeichen für die Praxis sein", "summary": "Weil KI-Antworten und zusammenfassende Suchergebnisse viele Informationsfragen direkt beantworten, rufen weniger Nutzer Praxis-Websites auf. Laut der Podcastfolge entfallen dabei vor allem Besucher, die sich nur allgemein informieren, während Suchanfragen mit konkreter Terminabsicht für Praxen entscheidend bleiben. Statt auf die Gesamtkurve zu schauen, sollten Praxen einzelne Unterseiten und Suchbegriffe auswerten und mit dem tatsächlichen Patientenaufkommen abgleichen.", "wbd": "Ein Rückgang der Sichtbarkeitswerte ist für sich allein kein Grund zu hektischen Änderungen an der Website; aussagekräftiger ist der Abgleich der Zahlen mit Terminanfragen und Behandlungsschwerpunkten. Unaufgeforderte Website-Analysen per Mail sollten Praxen kritisch prüfen, bevor sie Budget umschichten.", "importance": 15, "reasons": ["Betrifft Praxen indirekt", "Fachbeitrag", "Aus unserem Netzwerk"], "category": "praxismarketing", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-10-07T05:00:00+00:00", "quellen": [{"name": "punk.tuell Podcast (Test)", "url": "https://praxismarketing.podigee.io/185-sichtbarkeit-sinkt-umsatz-steigt-du-sprichst-die-richtigen-menschen-an-163"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": true, "slug": "praxismarketing"}, {"id": "d792baca-a553-4372-b408-5c5889990ecd", "headline": "VDDI-Chef Pace zu Regulierung, MDR-Aufwand und Innovationen vor der IDS 2027", "summary": "Im Interview äußert sich VDDI-Vorstandschef Mark Stephen Pace zum Verhältnis von gesetzlichen Vorgaben und Neuentwicklungen in der Zahnmedizin. Er hält klare Regeln etwa zu Hygiene und Dokumentation für sinnvoll, kritisiert aber den Aufwand durch die EU-Medizinprodukteverordnung und nennt die Debatten um Ethanol-Desinfektion und Wischdesinfektion als Beispiele für praxisferne Ansätze. Als Innovationsfelder hebt er unter anderem KI-gestützte Bildauswertung, neue bildgebende Verfahren, 3D-Druck und Laser in der Endodontie hervor, die auf der IDS im März 2027 in Köln zu sehen sein sollen.", "wbd": "Für Praxen ändert sich durch das Interview nichts; es gibt die Sicht der Dental-Industrie auf Regulierung wieder. Die Diskussion um alkoholische Desinfektionsmittel sieht der Verband nach aktuellem Stand als entschärft an.", "importance": 5, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-12T04:54:00+00:00", "quellen": [{"name": "DZW / mgb dental (Test)", "url": "https://mgb-dental.de/news/zahnmedizin/zwischen-ueber-regulation-und-innovation"}], "roles": ["industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}, {"id": "df020e35-402a-43de-b01a-6693b4066efd", "headline": "gematik zieht Bilanz nach einem Jahr ePA: über 100 Millionen Dokumente eingestellt", "summary": "Die gematik hat zum ersten Jahrestag der „ePA für alle“ Nutzungszahlen vorgelegt: Seit dem Start wurden mehr als 100 Millionen Dokumente hochgeladen, und pro Woche werden im Schnitt über 21 Millionen Medikationslisten abgerufen. Nach Angaben der gematik greifen wöchentlich bis zu 93.000 Arzt- und Zahnarztpraxen auf die Akten zu, außerdem sind inzwischen mehr als 5,5 Millionen Zahnbonushefte über die ePA verfügbar. Für dieses Jahr kündigt die gematik weitere Funktionen an, darunter einen erweiterten digitalen Medikationsplan mit strukturierten Dosierangaben, eine Volltextsuche für Versicherte und die Datenausleitung für die Forschung.", "wbd": "Für Praxen ändert sich durch die Bilanz unmittelbar nichts; sie zeigt aber, dass die ePA einschließlich des digitalen Zahnbonushefts im zahnärztlichen Alltag angekommen ist. Die angekündigten Funktionen, etwa der erweiterte Medikationsplan, dürften künftig Anpassungen in der Praxissoftware mit sich bringen.", "importance": 50, "reasons": ["Betrifft Praxen direkt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-04-15T12:28:53+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/ein-jahr-epa-fuer-alle-mehr-als-100-millionen-hinterlegte-dokumente-verbessern-behandlung-und-versorgung-in-deutschland"}], "roles": ["zahnarzt", "team"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "e23590f6-f0cf-4137-940f-ef78a8f15ed3", "headline": "gematik startet Podcast „Gesund vernetzt“ mit Schwerpunkt elektronische Patientenakte", "summary": "Die gematik hat ein eigenes Podcast-Format gestartet, das sich mit Digitalisierungsvorhaben im Gesundheitswesen befasst. Im Mittelpunkt steht vor allem die elektronische Patientenakte, moderiert wird die Reihe von gematik-Geschäftsführerin Brenya Adjei. In der Auftaktfolge berichtet ein Hausarzt aus Altenberge über seine Erfahrungen mit der ePA im Praxisbetrieb und über noch bestehende Schwierigkeiten.", "wbd": "Für Zahnarztpraxen ändert sich nichts; der Podcast ist ein freiwilliges Informationsangebot. Wer sich für Praxiserfahrungen mit der ePA interessiert, findet ihn auf der gematik-Website und den üblichen Podcast-Plattformen.", "importance": 13, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-05-27T14:36:00+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/gematik-launcht-podcast-gesund-vernetzt"}], "roles": [], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "e873a7b3-c226-475c-9b1e-6f6f83a295d4", "headline": "gematik pilotiert kartenlose Institutionsidentität HSM-B im Highspeed-Konnektor", "summary": "Die gematik erprobt mit der RHÖN-KLINIKUM AG ein Verfahren, bei dem sich Einrichtungen in der Telematikinfrastruktur ohne physische SMC-B-Karte ausweisen können. Die Identität der Einrichtung liegt dabei in einem Sicherheitsmodul des Highspeed-Konnektors von RISE, die Zertifikate stammen von D-Trust, die Ausgabeprozesse koordiniert die DKTIG. Der Test ist auf den Klinikverbund beschränkt und soll Erkenntnisse für eine spätere breite Einführung liefern.", "wbd": "Für Zahnarztpraxen ändert sich derzeit nichts, die SMC-B-Karte im Kartenterminal bleibt erforderlich. Langfristig könnte ein kartenloses Verfahren Hardware und PIN-Eingaben reduzieren, einen Zeitplan dafür nennt die gematik aber nicht.", "importance": 25, "reasons": ["Betrifft Praxen indirekt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-03-10T13:14:13+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/gemeinsames-pilotprojekt-zur-kartenlosen-institutions-identitaet-hsm-b-im-highspeed-konnektor"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "ee7f90e0-7f7c-442a-bf5b-3d0c64a66442", "headline": "gematik: Einblick in die Pilotierung von PoPP und dgMP in den TI-Modellregionen", "summary": "In einem Interview beschreibt eine Produktmanagerin der gematik, wie neue TI-Anwendungen wie PoPP und der digital gestützte Medikationsprozess in Modellregionen erprobt werden. Teilnehmende Einrichtungen, darunter auch Zahnarztpraxen, erhalten schrittweise Software-Updates ihrer Hersteller und werden von einem lokalen Projektbüro unter anderem mit Befragungen, Austauschrunden und Hospitationen begleitet. Als nächste Pilotprojekte bereitet die gematik das elektronische T-Rezept und die Volltextsuche in der ePA vor.", "wbd": "Für Praxen außerhalb der Modellregionen ändert sich vorerst nichts; die Erfahrungen aus den Pilotierungen sollen in die spätere flächendeckende Einführung der Anwendungen einfließen.", "importance": 15, "reasons": ["Betrifft Praxen indirekt", "Bericht"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-16T12:02:10+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/3-fragen-an-lena-teipelke-produktmanagerin-modellregionen"}], "roles": ["zahnarzt"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "ef8f5ce1-5323-4f74-869f-98dbf0a0352b", "headline": "GOZ-Nr. 0110: Fachbeitrag zur Höhe des Zuschlags für das OP-Mikroskop", "summary": "Ein Fachbeitrag in der Dentalpresse befasst sich mit dem Zuschlag für den Einsatz eines Operationsmikroskops nach GOZ-Nr. 0110 und dessen Betrag von 22,50 Euro. Der Autor verweist darauf, dass das Mikroskop vor allem in der Endodontie und Chirurgie feine Strukturen sichtbar macht, die Anschaffung aber teuer und die Arbeit damit fordernd ist. Der vorliegende Textauszug lässt offen, welche Schlussfolgerungen zur Abrechnung im Beitrag gezogen werden.", "wbd": "An der geltenden Abrechnung ändert sich durch den Beitrag nichts; er greift die Frage auf, ob der feste Zuschlag den Aufwand angemessen abbildet. Wer Details zur Berechnung sucht, sollte den vollständigen Beitrag in der Quelle lesen.", "importance": 40, "reasons": ["Betrifft Praxen direkt", "Fachbeitrag"], "category": "abrechnung", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-13T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/wirtschaft-und-recht/abrechnung/op-mikroskop-zuschlag-goz-nr-0110-2250-eur-und-keinen-cent-mehr"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "abrechnung"}, {"id": "f121a0cf-f46e-47a1-91ed-eed9ef7b52f7", "headline": "gematik startet Befragung zum TI-Atlas 2026 – auch Zahnarztpraxen eingeladen", "summary": "Die gematik erhebt zusammen mit dem IGES Institut erneut, wie weit die Digitalisierung im Gesundheitswesen fortgeschritten ist und wie sie im Alltag erlebt wird. Bis Ende Mai 2026 können Einrichtungen wie Zahnarzt- und Arztpraxen, Apotheken oder Kliniken mit einem zugesandten Einladungscode teilnehmen; parallel läuft eine Bevölkerungsumfrage. Themen sind unter anderem die Nutzung der ePA, die Stabilität der TI samt TI-Gateway sowie KI, digitaler Medikationsprozess und E-Überweisung, die Ergebnisse sollen ab Juli 2026 erscheinen.", "wbd": "Praxen, die einen Einladungscode erhalten haben, können bis zum 31. Mai 2026 freiwillig ihre Erfahrungen mit ePA und TI-Stabilität einbringen. Eine Pflicht zur Teilnahme besteht laut Meldung nicht, für den Praxisbetrieb ändert sich nichts.", "importance": 50, "reasons": ["Betrifft Praxen direkt"], "category": "telematik", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-04-30T07:38:38+00:00", "quellen": [{"name": "gematik — Newsroom", "url": "https://www.gematik.de/newsroom/news-detail/ti-atlas-2026-befragung-zur-digitalisierung-im-gesundheitswesen-startet"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "telematik"}, {"id": "f797dea9-e03d-42de-b36d-f5165ff0e1fd", "headline": "Ivoclar bringt neue Trockenfräsmaschine PrograMill Dry für Dentallabore", "summary": "Ivoclar hat mit der PrograMill Dry eine neue 5-Achs-Fräsmaschine für die Trockenbearbeitung vorgestellt, die sich vor allem an Labore richtet, die in die digitale Fertigung einsteigen wollen. Nach Herstellerangaben soll sie Zirkonoxid und PMMA bis zu 20 Prozent schneller bearbeiten als das Vorgängergerät und dank kompakter Maße auch in kleinen Laboren Platz finden. Ein Touchdisplay mit geführter Bedienung, ein Absaugsystem mit Ionisator sowie Videoanleitungen für Wartung und Reparatur sollen den Pflegeaufwand und Stillstandszeiten verringern.", "wbd": "Für Praxen ändert sich nichts; für Labore und Praxislabore mit Interesse an eigener CAD/CAM-Fertigung ist es eine Produktinformation, deren Leistungsangaben vom Hersteller stammen.", "importance": 8, "reasons": ["Betrifft Praxen direkt", "Bericht", "Unternehmensmeldung"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-15T03:00:00+00:00", "quellen": [{"name": "DZW / mgb dental (Test)", "url": "https://mgb-dental.de/news/zahntechnik/clever-fraesen-ressourcen-sparen"}], "roles": ["labor", "industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}, {"id": "f9aa1e60-994c-4b86-8aa1-208259cd9b37", "headline": "Azubi-Seite der Praxis auch bei besetzten Plätzen online lassen?", "summary": "Eine Podcastfolge zum Praxismarketing geht der Frage nach, ob Praxen ihre Ausbildungsseite abschalten sollten, wenn alle Plätze vergeben sind. Die Sprecher raten davon ab, weil eine fehlende Seite den Eindruck erweckt, die Praxis bilde nicht aus, und weil viele Interessenten ihre Suche bereits ein bis zwei Jahre vorher beginnen. Als Mittelweg schlagen sie vor, bezahlte Anzeigen zu pausieren und auf der Seite offen zu vermerken, dass die Plätze aktuell vergeben sind und im Folgejahr wieder gesucht wird.", "wbd": "Praxen, die ausbilden, können ihre Ausbildungsseite dauerhaft sichtbar lassen und mit einem kurzen Hinweis auf den aktuellen Stand versehen, statt sie zeitweise zu entfernen. Ergänzend kann Ausbildung auch im Wartezimmer sichtbar gemacht werden, etwa über Aushänge oder Flyer.", "importance": 53, "reasons": ["Betrifft Praxen direkt", "Empfehlung", "Aus unserem Netzwerk"], "category": "praxismarketing", "status": "published", "hb": "beobachten", "frist": null, "datum": "2026-10-14T05:00:00+00:00", "quellen": [{"name": "punk.tuell Podcast (Test)", "url": "https://praxismarketing.podigee.io/186-neue-episode"}], "roles": ["zahnarzt", "praxismanagement"], "fristIso": null, "terminIso": null, "fb": null, "network": true, "slug": "praxismarketing"}, {"id": "fc3e97c9-f3b1-4fb1-82d3-4dd7c6cc53ca", "headline": "exocad bringt Implantatplanungssoftware exoplan 3.3 Chemnitz heraus", "summary": "Der CAD-Softwareanbieter exocad hat eine neue Version seiner Implantatplanungslösung exoplan vorgestellt. Die Ausgabe trägt die Versionsbezeichnung 3.3 Chemnitz. exocad gehört zum US-Konzern Align Technology; Details zu neuen Funktionen nennt die Meldung nicht.", "wbd": "Praxen und Labore, die exoplan nutzen, können sich beim Anbieter über die neue Version und mögliche Updates informieren. Eine Pflicht zum Handeln ergibt sich daraus nicht.", "importance": 15, "reasons": ["Betrifft Praxen direkt", "Bericht", "Unternehmensmeldung"], "category": "markt_industrie", "status": "published", "hb": "keiner", "frist": null, "datum": "2026-11-12T07:00:00+00:00", "quellen": [{"name": "ZWP online (Test)", "url": "https://www.zwp-online.info/zwpnews/dental-news/branchenmeldungen/exocad-veroffentlicht-ecoplan-33-chemnitz"}], "roles": ["zahnarzt", "labor", "industrie"], "fristIso": null, "terminIso": null, "fb": null, "network": false, "slug": "markt-industrie"}], "cats": {"telematik": ["Telematik & Digitalisierung", "TI, E-Rezept, ePA, Kartentausch und Praxissoftware"], "fortbildung": ["Fortbildung & Veranstaltungen", "Kongresse, Tagungen, Webinare und Messen"], "markt-industrie": ["Industrie & Handel", "Neue Geräte, Materialien und Software"], "wissenschaft": ["Wissenschaft & Leitlinien", "Studien, Fachbeiträge und neue Leitlinien"], "standespolitik": ["Standespolitik", "Kammern, KZBV, Verbände und ihre Forderungen"], "recht-politik": ["Recht & Politik", "Gesetze, Urteile und politische Pläne"], "gkv-pkv": ["Gesundheitspolitik GKV & PKV", "Krankenkassen, Versicherte und Leistungen"], "abrechnung": ["Abrechnung", "BEMA, GOZ und was Praxen abrechnen dürfen"], "hygiene-mp": ["Hygiene & Medizinprodukte", "Hygiene, Wasserqualität, Rückrufe und Medizinprodukte"], "praxisfuehrung": ["Praxisführung", "Personal, Arbeitsrecht, Datenschutz und Organisation"], "praxismarketing": ["Praxismarketing", "Website, Bewertungen, Social Media, Video und Personalgewinnung"]}, "extraFristen": []}</script>

      if(d.frist) sub.appendChild(el('span','pill frist','Frist '+d.frist));
      a.appendChild(sub);
      a.onclick=function(){ pending=d.id; };
      li.appendChild(a); ol.appendChild(li);
    });
    view.appendChild(ol);
    view.appendChild(el('h2','sec','Themen'));
    view.appendChild(el('p','total', S.length+' Meldungen in '+slugs.length+' Themen. Wählen Sie ein Thema.'));
    var nNew=S.filter(isNew).length;
    if(nNew){ var nl=el('p','newline'); nl.appendChild(el('span','newdot')); nl.appendChild(document.createTextNode(nNew+' neue Meldungen seit Ihrem letzten Besuch am '+LAST_VISIT_TXT)); view.appendChild(nl); }
    var g=el('div','grid'); slugs.forEach(function(s){ g.appendChild(tile(s,c[s],false)); }); view.appendChild(g);
    view.appendChild(adBox());
    view.appendChild(recoSection(['punktuell','pelf'],'Zum Hören'));
  }
  var pending=null;
  function topic(slug){
    if(!C[slug]){ location.hash='#start'; return; }
    var rows=S.filter(function(d){ return d.slug===slug; });
    rows.sort(sort==='wichtig' ? function(a,b){ return b.importance-a.importance || new Date(b.datum)-new Date(a.datum); } : function(a,b){ return new Date(b.datum)-new Date(a.datum); });
    view.replaceChildren();
    var back=el('a','back','← Alle Themen im Überblick'); back.href='#start'; view.appendChild(back);
    view.appendChild(el('p','eyebrow','Thema'));
    view.appendChild(el('h1',null,C[slug][0]));
    var bar=el('div','bar'); bar.appendChild(el('span','total',rows.length+(rows.length===1?' Meldung':' Meldungen')));
    var seg=el('div','seg'); [['wichtig','Empfohlene Reihenfolge'],['neu','Neueste zuerst']].forEach(function(o){
      var b=el('button','chip',o[1]); b.type='button'; b.setAttribute('aria-pressed',String(sort===o[0])); b.onclick=function(){ sort=o[0]; topic(slug); }; seg.appendChild(b); });
    bar.appendChild(seg); view.appendChild(bar);
    var list=el('div','list');
    rows.forEach(function(d){ list.appendChild(articleEl(d)); });
    view.appendChild(list);
    if(slug==='praxisfuehrung') view.appendChild(adBox());
    view.appendChild(recoSection([PELF_TOPICS.indexOf(slug)>=0?'pelf':'punktuell'],'Passend zum Thema'));
    var c=counts(), others=Object.keys(c).filter(function(s){ return s!==slug; }).sort(function(a,b){ return c[b]-c[a]; });
    var o=el('section','other'); o.appendChild(el('h2','sec','Anderes Thema wählen'));
    var g=el('div','grid'); others.forEach(function(s){ g.appendChild(tile(s,c[s],true)); }); o.appendChild(g); view.appendChild(o);
  }
  function header(eyebrow, title, lead){
    view.replaceChildren();
    var back=el('a','back','← Zurück zu den Themen'); back.href='#start'; view.appendChild(back);
    view.appendChild(el('p','eyebrow',eyebrow)); view.appendChild(el('h1',null,title)); if(lead) view.appendChild(el('p','lead',lead));
  }
  function calRow(date, kind, title, what, d, past){
    var a=el('a','cal-row'+(kind==='Frist'?' frist':'')+(past?' past':'')); a.href='#thema-'+d.slug; a.onclick=function(){ pending=d.id; };
    var dt=new Date(date+'T12:00:00'), box=el('div','cal-date');
    box.appendChild(el('b',null,String(dt.getDate()))); box.appendChild(el('span',null,dt.toLocaleDateString('de-DE',{month:'short'}).replace('.','')+' '+String(dt.getFullYear()).slice(2)));
    a.appendChild(box);
    var b=el('div','cal-body'); b.appendChild(el('span','cal-kind',kind)); b.appendChild(el('strong',null,title)); if(what) b.appendChild(el('p',null,what));
    if(!past){ var days=Math.round((dt-new Date('2026-11-16T12:00:00'))/86400000); b.appendChild(el('span','cal-left', days===0?'heute':days===1?'morgen':'in '+days+' Tagen')); }
    a.appendChild(b); return a;
  }
  function fristen(){
    header('Fristen & Termine','Was steht wann an?','Alle Fristen und Termine aus den Meldungen, zeitlich sortiert. Tippen Sie auf einen Eintrag, um die Meldung zu lesen.');
    var today='2026-11-16', items=[];
    S.forEach(function(d){ if(d.fristIso) items.push({date:d.fristIso, kind:'Frist', title:d.headline, what:d.fb, d:d}); if(d.terminIso) items.push({date:d.terminIso, kind:'Termin', title:d.headline, what:null, d:d}); });
    (D.extraFristen||[]).forEach(function(x){ var d=byId(x.id); if(d) items.push({date:x.date, kind:'Frist', title:x.title, what:x.what, d:d}); });
    items.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    var up=items.filter(function(x){ return x.date>=today; }), past=items.filter(function(x){ return x.date<today && x.date>='2026-08-18'; }).reverse();
    var fr=up.filter(function(x){ return x.kind==='Frist'; }), te=up.filter(function(x){ return x.kind==='Termin'; });
    view.appendChild(el('h2','sub','Fristen'));
    var c1=el('div','cal'); if(fr.length) fr.forEach(function(x){ c1.appendChild(calRow(x.date,x.kind,x.title,x.what,x.d,false)); }); else c1.appendChild(el('p','empty','Derzeit keine anstehenden Fristen.')); view.appendChild(c1);
    view.appendChild(el('h2','sub','Termine'));
    var c2=el('div','cal'); if(te.length) te.forEach(function(x){ c2.appendChild(calRow(x.date,x.kind,x.title,x.what,x.d,false)); }); else c2.appendChild(el('p','empty','Derzeit keine anstehenden Termine.')); view.appendChild(c2);
    if(past.length){ var det=el('details','past'); det.appendChild(el('summary',null,'In den letzten 3 Monaten vorbei ('+past.length+')')); var c3=el('div','cal'); past.forEach(function(x){ c3.appendChild(calRow(x.date,x.kind,x.title,x.what,x.d,true)); }); det.appendChild(c3); view.appendChild(det); }
  }
  function gemerkt(){
    header('Gemerkt','Ihre gemerkten Meldungen','Mit ☆ Merken legen Sie Meldungen hier ab, um sie später in Ruhe zu lesen.');
    var rows=saved.map(byId).filter(Boolean);
    var list=el('div','list'); if(rows.length) rows.forEach(function(d){ list.appendChild(articleEl(d)); }); else list.appendChild(el('p','empty','Noch nichts gemerkt. Tippen Sie bei einer Meldung auf ☆ Merken.')); view.appendChild(list);
  }
  var query='';
  function suche(){
    var q=query.trim().toLowerCase();
    header('Suche','„'+query.trim()+'“',null);
    var rows=q?S.filter(function(d){ return (d.headline+' '+d.summary+' '+(d.wbd||'')+' '+C[d.slug][0]).toLowerCase().indexOf(q)>=0; }):[];
    view.appendChild(el('p','total',rows.length+(rows.length===1?' Treffer':' Treffer')));
    var list=el('div','list'); if(rows.length) rows.forEach(function(d){ list.appendChild(articleEl(d)); }); else list.appendChild(el('p','empty','Keine Meldung gefunden. Versuchen Sie ein anderes Wort.')); view.appendChild(list);
  }
  function einstellungen(){
    header('Einstellungen','Ihr Ticker, Ihre Wahl','Hier legen Sie fest, ob und wie der Ticker Sie benachrichtigt. Ohne Ihre Zustimmung senden wir nichts.');
    function save(){ store('dt-settings',settings); }
    var b0=el('section','set'); b0.appendChild(el('h2',null,'Schriftgröße'));
    b0.appendChild(el('p',null,'Wählen Sie, wie groß Texte im Ticker erscheinen.'));
    var seg=el('div','seg3'); seg.setAttribute('role','group'); seg.setAttribute('aria-label','Schriftgröße');
    [['A','Normal'],['A+','Größer'],['A++','Am größten']].forEach(function(o,i){ var b=el('button',null,o[0]); b.type='button'; b.style.fontSize=(0.95+i*0.2)+'rem'; b.setAttribute('aria-label',o[1]); b.setAttribute('aria-pressed',String((settings.size||0)===i));
      b.onclick=function(){ settings.size=i; save(); applySize(); seg.querySelectorAll('button').forEach(function(x,j){ x.setAttribute('aria-pressed',String(j===i)); }); }; seg.appendChild(b); });
    b0.appendChild(seg); view.appendChild(b0);
    var bt=el('section','set'); bt.appendChild(el('h2',null,'Darstellung'));
    bt.appendChild(el('p',null,'Hell wie Papier oder dunkel für abends. Beide Varianten sind blendfrei und gut lesbar.'));
    var tg=el('div','opts'); tg.setAttribute('role','radiogroup'); tg.setAttribute('aria-label','Darstellung');
    [['light','☀ Hell'],['dark','☾ Dunkel'],['auto','Wie mein Gerät']].forEach(function(o){ var l=el('label'), i=el('input'); i.type='radio'; i.name='theme'; i.id='theme-'+o[0]; i.checked=(settings.theme||'light')===o[0];
      i.onchange=function(){ settings.theme=o[0]; save(); applyTheme(); }; l.appendChild(i); l.appendChild(document.createTextNode(o[1])); tg.appendChild(l); });
    bt.appendChild(tg); view.appendChild(bt);
    var b1=el('section','set'); b1.appendChild(el('h2',null,'Tagesbriefing'));
    b1.appendChild(el('p',null,'Eine kurze Nachricht am Morgen mit den neuen Meldungen des Tages. Standardmäßig ausgeschaltet.'));
    var sw=el('label','switch'); sw.appendChild(el('span',null,'Tagesbriefing erhalten')); var cb=el('input'); cb.type='checkbox'; cb.id='briefing'; cb.checked=!!settings.briefing; sw.appendChild(cb); b1.appendChild(sw);
    var more=el('div'); more.style.display='flex'; more.style.flexDirection='column'; more.style.gap='12px';
    var r=el('div','row2'); r.appendChild(el('span',null,'Uhrzeit')); var t=el('select'); t.id='btime'; ['06:00','06:30','07:00','07:30','08:00','12:00','18:00'].forEach(function(v){ var o=el('option',null,v+' Uhr'); o.value=v; if(v===settings.time) o.selected=true; t.appendChild(o); }); t.onchange=function(){ settings.time=t.value; save(); }; r.appendChild(t); more.appendChild(r);
    var ch=el('div','opts'); [['app','Als App-Benachrichtigung'],['mail','Per E-Mail']].forEach(function(o){ var l=el('label'), i=el('input'); i.type='radio'; i.name='chan'; i.id='chan-'+o[0]; i.checked=settings.channel===o[0]; i.onchange=function(){ settings.channel=o[0]; save(); }; l.appendChild(i); l.appendChild(document.createTextNode(o[1])); ch.appendChild(l); }); more.appendChild(ch);
    more.hidden=!settings.briefing; b1.appendChild(more);
    var ok=el('p','note-ok'); function paintOk(){ ok.textContent=settings.briefing?('Eingeschaltet: täglich um '+settings.time+' Uhr'+(settings.channel==='mail'?' per E-Mail.':' als App-Benachrichtigung.')):'Ausgeschaltet. Sie erhalten keine Nachrichten.'; } paintOk(); b1.appendChild(ok);
    cb.onchange=function(){ settings.briefing=cb.checked; more.hidden=!cb.checked; save(); paintOk(); };
    t.addEventListener('change',paintOk); ch.addEventListener('change',paintOk);
    view.appendChild(b1);
    var b2=el('section','set'); b2.appendChild(el('h2',null,'Ich arbeite als …'));
    b2.appendChild(el('p',null,'Optional. Dann zeigen wir Ihnen Meldungen für Ihre Rolle zuerst. Alle anderen bleiben sichtbar.'));
    var ro=el('div','opts'); Object.keys(ROLE).forEach(function(k){ var l=el('label'), i=el('input'); i.type='checkbox'; i.id='role-'+k; i.checked=settings.roles.indexOf(k)>=0; i.onchange=function(){ var x=settings.roles.indexOf(k); if(i.checked&&x<0) settings.roles.push(k); if(!i.checked&&x>=0) settings.roles.splice(x,1); save(); }; l.appendChild(i); l.appendChild(document.createTextNode(ROLE[k])); ro.appendChild(l); }); b2.appendChild(ro);
    view.appendChild(b2);
    var b3=el('section','set'); var hh=el('div','row2'); hh.appendChild(el('h2',null,'Wochen-Hörbriefing')); hh.appendChild(el('span','soon','Demnächst')); b3.appendChild(hh);
    b3.appendChild(el('p',null,'Jeden Freitag rund 5 Minuten zum Anhören: die Meldungen der Woche, gesprochen. Ideal für den Weg in die Praxis.'));
    var sw2=el('label','switch'); sw2.appendChild(el('span',null,'Benachrichtigen, sobald es verfügbar ist')); var cb2=el('input'); cb2.type='checkbox'; cb2.id='audio'; cb2.checked=!!settings.audio; cb2.onchange=function(){ settings.audio=cb2.checked; save(); }; sw2.appendChild(cb2); b3.appendChild(sw2);
    view.appendChild(b3);
  }
  function route(){
    var h=(location.hash||'').slice(1), nav='start';
    if(h.indexOf('thema-')===0){ topic(h.slice(6)); }
    else if(h==='fristen'){ fristen(); nav='fristen'; }
    else if(h==='gemerkt'){ gemerkt(); nav='gemerkt'; }
    else if(h==='einstellungen'){ einstellungen(); nav='einstellungen'; }
    else if(h==='suche' && query){ suche(); nav=''; }
    else { start(); }
    document.querySelectorAll('.mainnav a').forEach(function(a){ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    if(pending){ var t=document.getElementById('m-'+pending); pending=null; if(t){ t.scrollIntoView({block:'start'}); t.classList.add('flash'); setTimeout(function(){ t.classList.remove('flash'); },1600); return; } }
    window.scrollTo(0,0);
  }
  // Podcast-Karten nebeneinander: Beschreibung und Folgen-Kasten gleich hoch, damit Kasten und Knopf auf einer Linie sitzen.
  function alignPods(){
    document.querySelectorAll('.reco-grid').forEach(function(g){
      var cards=Array.prototype.slice.call(g.querySelectorAll('a.pod'));
      ['.t','.ep'].forEach(function(sel){
        var els=cards.map(function(c){ return c.querySelector(sel); }).filter(Boolean);
        els.forEach(function(e){ e.style.minHeight=''; });
        var sideBySide=cards.length>1 && cards[0].getBoundingClientRect().top===cards[1].getBoundingClientRect().top;
        if(!sideBySide) return;
        var h=Math.max.apply(null, els.map(function(e){ return e.getBoundingClientRect().height; }));
        els.forEach(function(e){ e.style.minHeight=h+'px'; });
      });
    });
  }
  window.addEventListener('resize', alignPods);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignPods);
  window.addEventListener('hashchange', function(){ setTimeout(alignPods, 0); });
  document.getElementById('searchForm').addEventListener('submit', function(e){ e.preventDefault(); query=document.getElementById('q').value; if(!query.trim()) return; if(location.hash==='#suche') route(); else location.hash='#suche'; });
  updateSaved(); applySize(); applyTheme();
  window.addEventListener('hashchange', route); route(); alignPods();
})();
</script>
